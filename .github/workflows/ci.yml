name: CPU checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_pipeline.py tests/test_metric.py tests/test_folder_batch.py tests/test_fast_capture.py tests/test_dense_board.py tests/test_progress.py tests/test_meshy_branch.py tests/test_meshy_case.py tests/test_meshy_views.py
      - run: python -m compileall -q packing_assets scripts
      - run: python -m pytest -q tests/test_optional_tools.py
      - run: python -m pytest -q tests/test_streaming_delivery.py
      - run: python -m pytest -q tests/test_meshy_credentials.py
      - run: python -m pytest -q tests/test_meshy_fast.py
      - run: python -m pytest -q tests/test_upload_server.py
      - run: python -m pytest -q tests/test_source_package.py
      - run: python scripts/package_source.py --check
